<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Old Way
        const name = "John"
        const age = 21

        const greeting = "Hello My Name is" + name + "and i am" + age + "Years old"

        console.log(greeting)


        //New Way - Template Sring using `` ${Variable/Parameter}

        const message = `
        Dear ${name}

        Welcome to Our Js 
        You are ${age} Years old
        
        `
        console.log(message)


        console.log("5" + 3)  // 53(Number will become String - in Addtion)
        console.log("5"- 3)    //2 (String Wil Become Number - In Substraction)
        console.log("5"*"3")  //15 (Multiplcation : String Will Become Number)
        console.log(5 + true) // 6 (true becomes 1)
        console.log(5 + null)  //5 (null becomes 0)
        console.log(5 + undefined)  //NaN  (Not a Number)
    </script>
</body>
</html>
