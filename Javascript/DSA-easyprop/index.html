        //FizzBuzz - 
        //1.Problem Statement : From Numbers 1 to 15 - Print Fizz If it is Divisble by 3.Print Buzz Divisble by 5
        //FizzBuzz Both Disvisble 5 , 3 else print Number

        function fizzBuzz(num){

            for(let i = 1; i <=num;i++){

               if(i % 3 === 0 && i % 5 === 0){
                   console.log("FizzBuzz")
               }else if(i % 3 === 0){
                console.log("Fizz")
               }else if(i % 5 === 0){
                console.log("Buzz")
               }else{
                console.log(i)
               }

            }

        }
        fizzBuzz(15)

        //2. Check if Prime 
        function isPrime(num){

            if(num<2) return false;

            for(let j =2; j <num; j++){
                if(num % j === 0) return false    
            }

            return true

        }

        console.log(isPrime(7))
        console.log(isPrime(8))


        //3. Reserver a String

        function reverseString(str){

            //length - Total Number of Characters- It Starts the count with 1

             let rev = ""

             for(let k = str.length-1; k >=0; k--){
                rev+= str[k]
             }
        }
        reverseString("hello")  //olleh

        //5.Find factorial - Multplication
          //  4! : 4*3*2*1 = 24

        function factorial(n){

            let result = 1

            for(let p =1 ; p<=n;p++){

                result*=p;

            }

            return result



        }
      console.log( factorial(5))

        //8. Sum of Digits- 
        function sumOfDigits(num){

            let sum = 0;

            while(num > 0){
                sum+= num%10;
                num = Math.floor(num/10)  //Removing Decimal means floor 2.5 = 2 , 2.9 = 2
            }

            return sum

        }

        //9. Count Vowels - String Method
            
        function countVovwel(strs){
            let count = 0;

            const vowels = "aeiouAEIOU"

            for(const char of strs){
                  if(vowels.includes(char)) count ++
            }

            return count
        }
