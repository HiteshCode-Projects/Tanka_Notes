<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Data Types - Different Types of Data

        //STRING - Text in quotes "Text" or 'Text'

         const name = "Tanka"

         const city = "France"

         const password = "1245"

         //typeof()  Method In Build Methods Feature in Js - Use Directly
         console.log(typeof(name))


         //Number - Any Number (whole,neg,decimal)

         const age = 10
         const price = 99.99
         const temp = -23

         //Boolean - true or false
         const IsLoggedin = true
         const NetflixSub = false

         //Null - Nothing - intentionally empty
         const noValue = null;
         console.log(typeof(noValue))
         //Due To Bug In Js It shows Object as Data Type - No Logic

         //UnDefined- No value Assigned
         let userEmail;  //Automatically Undefined


         //Data type 2 : Handles Multiple Data

         //Array - List of Data/ Multiple Data storing in box - Only Js we can store Diff Data Tyoes as well

         const fruits = ["Apple" , "banana" , true , 123]
         
         //Object - Collection of Properties
         const employee = {
            //key:pair format
            name:"Tanka",
            city:"France"
         }


    </script>
</body>
</html>
