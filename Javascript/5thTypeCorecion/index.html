<body>
    <script>
        console.log("5" + 3)  // 53(Number will become String - in Addtion)
        console.log("5"- 3)    //2 (String Wil Become Number - In Substraction)
        console.log("5"*"3")  //15 (Multiplcation : String Will Become Number)
        console.log(5 + true) // 6 (true becomes 1)
        console.log(5 + null)  //5 (null becomes 0)
        console.log(5 + undefined)  //NaN  (Not a Number)

       let username;

       username = "Tanka"
       
       console.log(username)



        //String To Number 
        const str = "42"

        console.log(Number(str))  //42
        console.log(parseInt(str))  //42 - Int
        console.log(parseFloat("3.14"))  //3.14 - Float value

        //Number To String
        const num =42
        console.log(String(num))  // "42"
        console.log(num.toString())  //"42"


        //To Boolean
        console.log(Boolean(1)) //true
        console.log(Boolean(0))  //false

        console.log(Boolean(""))  // Empty String is Always False
        console.log(Boolean("Hello"))  //true



        
    </script>
