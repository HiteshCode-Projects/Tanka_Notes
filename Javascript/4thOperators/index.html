<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Operators are used to perfomr Action on Data

        //1.Arthmetic Opertaors: - , + , / , * , %(Remainder)

        const a = 10
        const b = 3

        console.log(a+b)
        console.log(a-b)
        console.log(a*b)
        console.log(a/b)
        console.log(a%b)

        //Increment and Decrement
        let count = 5
        count++  //Count is 6
        count--  //Count is 5

        count+=3 //Count is 8
        count *=2  //Count is 16


        //Comaprison Op- Boolean format
        //== Means Only Checks Value

        console.log(5 == 5)   //True
        console.log(5 == "5") //True

        //=== Checks value and Data type
        console.log(5 === 5)    //True
        
        console.log(5 === "5")  //False

        console.log(5!=3)  //true
        console.log(5 !== "5")  //true


        //Logocal op
        //AND - Both COndition True Output is True
        //OR - Atleast One Condition True Output is True
        //! Opp Value

        const age = 25
        const hasLicense = true

        console.log(age>=18 && hasLicense)  //True

        console.log(age < 18 || age > 65)  //True

        

    </script>
</body>
</html>
