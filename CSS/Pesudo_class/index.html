<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: orange;
            cursor: pointer;
            transition: 2s;
            border: none;
        }

        input:focus{
            border: 2px solid blue;
        }

        /* First and Last Child */
         li:first-child{
            color: red;
        }

        li:last-child{
            color: blue;
        }
    </style>
</head>
<body>
    <button>Hello</button>

    <input placeholder="Name">


    <ul>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ul>
</body>
</html>
