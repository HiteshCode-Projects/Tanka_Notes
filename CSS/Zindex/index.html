<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .modal{
            position: fixed;
            top: 50%;
            left: 50%;
            background-color: aqua;
            z-index: 1000;
        }
        .overlap{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="modal">
        Modal
    </div>

    <div class="overlap">
        Overlap
    </div>
</body>
</html>
