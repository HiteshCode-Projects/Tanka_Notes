<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Block Elements - takes full width, Stack Vertically 
    div , p , h1 to h6, section , article
    
    display:block
    -->

    <!-- Inline Elements - Only Take Needed width/Required Amount of wdith as per my content, sit side by side
    span , a , strong , em 
    display:inline
    -->
    <!-- <strong>Hello</strong>
    <em>Good eve</em> -->

    <!-- Inline-Bloc(Best of both sits Inline but Takes  width/height) -->

    <button
    style="display: inline-block;
    width: 150px;
    height: 150px;
    padding: 10px;
    
    "

    >Login</button>
    

    <!-- None - Complete Hide the tag 
    display:none
    Takes no space at all 
    -->
</body>
</html>
