<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="city">Choose your city</label>
    <select id="city" >
         <option  value="mumbai"  >Mumbai-Finance</option>
         <option  value="del"  >Delhi-Captial</option>
         <option  value="kathmandu" selected>Kathmandu-Nepal</option>
    </select>


     <select id="city" multiple>
         <option  value="mumbai"  >Mumbai-Finance</option>
         <option  value="del"  >Delhi-Captial</option>
         <option  value="kathmandu" selected>Kathmandu-Nepal</option>
    </select>

    <!-- Grouped Option -->
     <select name="food">
        <optgroup label="South India">
               <option>Dosa</option>
        </optgroup>

        <optgroup label="North India">
            <option>Paneer</option>
        </optgroup>
     </select>
</body>
</html>
