<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
     <thead>
        <!-- //Column  Name -->
       
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
            <th>Salary</th>
        </tr>


     </thead>

     <tbody>
        <!-- Data of Column -->
         <tr>
            <td>Girish</td>
            <td>25</td>
            <td>Bengaluru</td>
            <td>8 LPA</td>

         </tr>

         <tr>
            <td>Priya</td>
            <td>27</td>
            <td>Bengaluru</td>
            <td>8 LPA</td>

         </tr>

         <tr>
            <td>Rahul</td>
            <td>25</td>
            <td>Mumbai</td>
            <td>12 LPA</td>

         </tr>
     </tbody>


    </table>


    <!-- colspan and rowspan- Merging CCells - Cell Means 1 box of Table -->
     <table border="1">
        <tr>
            <th colspan="2">Personal Info</th>
            <th>City</th>
        </tr>


        <tr>
            <td>Girish</td>
            <td>25</td>
            <td rowspan="2">Benagaluru</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>27</td>

        </tr>
     </table>
</body>
</html>
